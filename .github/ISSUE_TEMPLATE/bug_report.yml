name: Bug report
description: Report a problem with the dsh-plugin-balance plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: The balance button shows a wrong cost estimate...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Install @lmmzss/dsh-plugin-balance
        2. Open the balance dropdown
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Version of @lmmzss/dsh-plugin-balance (e.g. 0.1.1)
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Output of `dsh --version` (or `npx @deepseek-ai/dsh --version`)
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Console errors, screenshots, or the dsh web log tail.
      render: text
    validations:
      required: false
